<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forms - Playwright Test Website</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <nav>
      <ul>
        <li><a href="/">Home</a></li>
        <li><a href="/login">Login</a></li>
        <li><a href="/dashboard">Dashboard</a></li>
        <li><a href="/forms">Forms</a></li>
        <li><a href="/api-demo">API Demo</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <section id="forms-section">
      <h1>Form Testing</h1>

      <form id="contactForm">
        <h2>Contact Form</h2>
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
          <label for="message">Message:</label>
          <textarea id="message" name="message" required></textarea>
        </div>
        <div class="form-group">
          <label for="priority">Priority:</label>
          <select id="priority" name="priority">
            <option value="low">Low</option>
            <option value="medium">Medium</option>
            <option value="high">High</option>
          </select>
        </div>
        <div class="form-group">
          <label>
            <input type="checkbox" id="newsletter" name="newsletter"> Subscribe to newsletter
          </label>
        </div>
        <button type="submit">Send Message</button>
      </form>

      <div id="form-message"></div>

      <div class="file-upload">
        <h2>File Upload</h2>
        <input type="file" id="fileInput" accept=".txt,.jpg,.png">
        <button id="uploadButton">Upload File</button>
        <div id="upload-status"></div>
      </div>
    </section>
  </main>

  <footer>
    <p>&copy; 2024 Playwright Test Website</p>
  </footer>

  <script src="script.js"></script>
</body>
</html>
